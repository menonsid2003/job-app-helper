<!doctype html>
<html>
<head><meta charset="utf-8"><title>Job Application for Test Role</title></head>
<body>
  <h1>Job Application for Test Role</h1>
  <form id="application_form">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text">

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text">

    <label for="email">Email</label>
    <input id="email" name="email" type="text">

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel">

    <label for="linkedin">LinkedIn Profile</label>
    <input id="linkedin" name="linkedin" type="text">

    <p>Resume</p>
    <input id="resume" name="resume" type="file">

    <p>Cover Letter</p>
    <input id="cover_letter" name="cover_letter" type="file">

    <label for="sponsorship">Will you now or in the future require sponsorship for a visa to remain in your current location?</label>
    <select id="sponsorship" aria-label="Will you now or in the future require sponsorship for a visa to remain in your current location?">
      <option value="">Select...</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label for="gender">Gender</label>
    <select id="gender" aria-label="Gender">
      <option value="">Select...</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="decline">Decline To Self Identify</option>
    </select>

    <label for="veteran">Veteran Status</label>
    <select id="veteran" aria-label="Veteran Status">
      <option value="">Select...</option>
      <option value="yes">I identify as one or more of the classifications of a protected veteran</option>
      <option value="no">I am not a protected veteran</option>
      <option value="decline">I don't wish to answer</option>
    </select>

    <button type="submit" id="submit_btn">Submit application</button>
  </form>
  <script>
    document.getElementById('application_form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML = '<h1>Thanks for applying!</h1>';
    });
  </script>
</body>
</html>
