<!doctype html>
<html>
<head><meta charset="utf-8"><title>Job Application for Test Role</title></head>
<body>
  <h1>Test Role at Acme</h1>
  <p>A great job description goes here.</p>
  <button type="button" id="apply_toggle" onclick="document.getElementById('hidden_form').style.display='block'; this.style.display='none';">Apply</button>

  <form id="hidden_form" style="display:none;">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text">

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text">

    <label for="email">Email</label>
    <input id="email" name="email" type="text">

    <p>Resume</p>
    <input id="resume" name="resume" type="file">

    <button type="submit" id="submit_btn">Submit application</button>
  </form>
  <script>
    document.getElementById('hidden_form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.innerHTML = '<h1>Thanks for applying!</h1>';
    });
  </script>
</body>
</html>
