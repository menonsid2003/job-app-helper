<!doctype html>
<html>
<head><meta charset="utf-8"><title>Job Application for Test Role</title></head>
<body>
  <form id="application_form">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text">

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text">

    <label for="email">Email</label>
    <input id="email" name="email" type="text">

    <p>Resume</p>
    <input id="resume" name="resume" type="file">

    <label for="how_hear">How did you hear about us?</label>
    <select id="how_hear" aria-label="How did you hear about us?">
      <option value="">Select...</option>
      <option value="referral">Referral</option>
      <option value="job_board">Job Board</option>
    </select>

    <button type="submit" id="submit_btn">Submit application</button>
  </form>
</body>
</html>
