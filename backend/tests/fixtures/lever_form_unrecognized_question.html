<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply for Test Role</title></head>
<body>
  <form id="application_form">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text">

    <label for="email">Email</label>
    <input id="email" name="email" type="text">

    <p>Resume/CV</p>
    <input id="resume" name="resume" type="file">

    <label for="how_hear">How did you hear about us?</label>
    <select id="how_hear" aria-label="How did you hear about us?">
      <option value="">Select...</option>
      <option value="referral">Referral</option>
      <option value="job_board">Job Board</option>
    </select>

    <button type="submit" id="submit_btn">Submit application</button>
  </form>
</body>
</html>
